name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Regression checks
        shell: pwsh
        run: dotnet run --project tests/RgbControl.Checks/RgbControl.Checks.csproj -c Release

      - name: Publish
        shell: pwsh
        run: ./scripts/publish.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" installer\RgbControl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem artifacts\RgbControl-Setup-*.exe).FullName
          $checksum = "$installer.sha256"
          "{0}  {1}" -f (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path $installer -Leaf) | Set-Content $checksum
          $notes = "docs/releases/$($env:GITHUB_REF_NAME.TrimStart('v')).md"
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME, $installer, $checksum, '--title', "RGB Control $env:GITHUB_REF_NAME")
          if (Test-Path $notes) { $arguments += @('--notes-file', $notes) } else { $arguments += '--generate-notes' }
          if ($env:GITHUB_REF_NAME.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
